name = "recovery-index-live"
main = "src/index.js"
compatibility_date = "2026-10-01"

# 4 updates each weekday at 10:00, 14:00, 18:00 and 21:30 IST (cron is UTC; IST = UTC+5:30).
# 21:30 IST is after the LME close in London, so the last run of the day is the daily close.
# That is ~88 requests a month, inside the metals.dev free plan (100). With a paid plan, raise
# MONTHLY_LIMIT and use e.g. ["30 3-15/2 * * MON-FRI"] (every 2 hours) or ["*/5 * * * MON-FRI"].
# Use day NAMES: Cloudflare numbers days 1 = Sunday, so "1-5" means Sun–Thu.
[triggers]
crons = ["30 4,8,12 * * MON-FRI", "0 16 * * MON-FRI"]

[vars]
MONTHLY_LIMIT = "92"   # hard cap on metals.dev requests per calendar month (UTC)

# Keep invocation logs so failed runs can be diagnosed in the dashboard.
[observability]
enabled = true

# Create with:  npx wrangler kv namespace create LIVE
# then paste the id it prints below. Bind the same namespace to the Pages site.
[[kv_namespaces]]
binding = "LIVE"
id = "8e558ea2f5d94a4e97931e9eff7968da"

# The metals.dev API key is a secret, never stored here. Set it with:
#   npx wrangler secret put METALS_API_KEY
